<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rendora · API</title><style>body{font:15px system-ui;color:#173b3a;background:#f6f8f5;max-width:1050px;margin:50px auto;padding:0 25px}h1{font-size:36px}p{line-height:1.8;color:#6b7f71}a{color:#125c59}details{border:1px solid #e0e8de;background:white;border-radius:8px;margin:10px 0;padding:15px}summary{cursor:pointer;font-family:monospace;font-size:14px}b{display:inline-block;width:65px;color:#125c59}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7ef;padding:15px;border-radius:5px;font-size:12px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dce5d7;border-radius:7px;margin:20px 0}small{display:block;color:#536b69;margin:15px 0}</style><link rel="icon" type="image/svg+xml" href="/brand/favicon.svg"/></head><body><a href="/">← Rendora · Gestão de imóveis e arrendamentos</a><h1>Rendora API</h1><p>API REST v1 para os portais e futura aplicação móvel. Valores monetários em cêntimos de euro. Autenticação por sessão ou token Bearer, com permissões verificadas em cada pedido.</p><a href="/openapi.json" download>Descarregar OpenAPI 3.0</a><input id="search" placeholder="Filtrar operações…" aria-label="Filtrar operações"><main id="operations"></main><script>fetch('/openapi.json').then(r=>r.json()).then(spec=>{const target=document.getElementById('operations');for(const[path,methods]of Object.entries(spec.paths))for(const[method,op]of Object.entries(methods)){const section=document.createElement('details');section.dataset.search=(method+' '+path).toLowerCase();const summary=document.createElement('summary');const badge=document.createElement('b');badge.textContent=method.toUpperCase();summary.append(badge,document.createTextNode('/api/v1'+path));section.append(summary);const info=document.createElement('small');info.textContent=op.security.length?'Autenticação obrigatória. Verifique X-Company-Id e permissões.':'Endpoint público / verificação específica de assinatura.';section.append(info);const pre=document.createElement('pre');pre.textContent=JSON.stringify({parameters:op.parameters,requestBody:op.requestBody,responses:op.responses},null,2);section.append(pre);target.append(section);}document.getElementById('search').addEventListener('input',e=>{for(const item of target.children)item.hidden=!item.dataset.search.includes(e.target.value.toLowerCase());});});</script></body></html>
